<div ng-controller="RegisterCohortsController" class="rwd-register-cohorts">
    <p ng-if="loading">Reading the uploaded scripts&hellip;</p>
    <p ng-if="!loading && rows.length === 0 && errors.length === 0">Upload cohort SQL scripts above, then reload this page.</p>
    <table class="table table-condensed" ng-if="rows.length">
        <thead>
            <tr><th>Script</th><th>Status</th><th>Cohort id</th><th>Name</th><th>Description</th><th>Submit</th><th>Replace</th></tr>
        </thead>
        <tbody>
            <tr ng-repeat="row in rows">
                <td>{{row.file}}</td>
                <td>{{statusLabel(row)}}</td>
                <td><input type="number" min="0" step="1" ng-model="row.id" ng-disabled="!row.submit" style="width: 6em"></td>
                <td><input type="text" ng-model="row.name" ng-disabled="!row.submit" maxlength="255"></td>
                <td><input type="text" ng-model="row.description" ng-disabled="!row.submit"></td>
                <td><input type="checkbox" ng-model="row.submit"></td>
                <td><input type="checkbox" ng-model="row.replace" ng-if="row.submit && isRegistered(row.id)"></td>
            </tr>
        </tbody>
    </table>
    <ul class="text-error" ng-if="errors.length"><li ng-repeat="e in errors">{{e}}</li></ul>
    <p class="text-success" ng-if="message">{{message}}</p>
    <button class="btn btn--secondary" ng-click="load()" ng-disabled="busy">Reload</button>
    <button class="btn btn--primary" ng-click="save()" ng-disabled="busy || !rows.length">Save submission</button>
</div>
