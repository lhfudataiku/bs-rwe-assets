<div class="rwd-compare">
    <h4>Compare cohorts</h4>
    <p class="rwd-muted">Pick two characterized cohorts. Cohort B defaults to the population, which is always ready.</p>
    <div class="rwd-row">
        <label>Cohort A
            <select id="rwd-cohort"></select>
        </label>
        <label>Cohort B
            <select id="rwd-comparator"></select>
        </label>
        <button id="rwd-compare" type="button">Compare</button>
    </div>
    <p id="rwd-message" class="rwd-message" role="status" aria-live="polite"></p>
</div>
